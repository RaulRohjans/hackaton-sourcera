<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f0">
  <title>The Liquid Briefing</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/studio.css') }}">
  <script src="{{ url_for('static', path='/studio.js') }}" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <p class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        The Liquid Briefing
      </p>
      <h1>Your news, in audio.</h1>
      <p class="replay-date">Historical news edition · {{ replay_date }}</p>
    </header>

    <div class="studio-grid">
      <section class="preferences" aria-labelledby="preferences-title">
        <h2 id="preferences-title">Listening preferences</h2>
        <form id="profile">
          <label class="field" for="listener">
            Listener preset
            <select id="listener">
              <option value="fx">FX desk</option>
              <option value="retail">Dutch investor</option>
              <option value="wildcard">Wildcard Listener</option>
              <option value="custom">Custom listener</option>
            </select>
          </label>
          <label class="field" for="interests">
            Interests
            <textarea id="interests" name="interests" rows="2" maxlength="240" required placeholder="e.g. Bitcoin, gold, aviation">{{ default_profile.interests }}</textarea>
          </label>
          <label class="field" for="language">
            Audio language
            <select id="language" name="language">
              <option value="en">English</option>
              <option value="nl">Dutch</option>
              <option value="de">German</option>
            </select>
          </label>
          <div class="field-grid">
            <label class="field" for="max_minutes">
              Length
              <select id="max_minutes" name="max_minutes">
                <option value="1">Up to 1 minute</option>
                <option value="2" selected>Up to 2 minutes</option>
                <option value="3">Up to 3 minutes</option>
              </select>
            </label>
            <label class="field" for="depth">
              Detail
              <select id="depth" name="depth">
                <option value="essentials">Essentials</option>
                <option value="analytical" selected>In depth</option>
              </select>
            </label>
          </div>
          <button class="button generate" type="submit" id="generate">Generate briefing <span aria-hidden="true">→</span></button>
        </form>
      </section>

      <div class="edition">
        <section class="player" aria-labelledby="player-title">
          <div class="player-heading">
            <h2 id="player-title">Your briefing</h2>
            <span class="player-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <p class="player-note" id="player-note">Your audio and stories will appear here.</p>
          <p class="status" id="status" role="status"></p>
          <audio id="audio" aria-label="Briefing audio" controls preload="metadata" hidden></audio>
          <a id="download-audio" class="button download" download hidden><span aria-hidden="true">↓</span> Download Audio</a>
          <button id="retry-audio" class="button retry" type="button" hidden>Retry audio</button>
        </section>
        <section class="stories" id="stories-panel" aria-labelledby="stories-heading" hidden>
          <h2 id="stories-heading"></h2>
          <div id="stories"></div>
        </section>
      </div>
    </div>
  </main>
  <script id="listener-presets" type="application/json">{{ presets | tojson }}</script>
</body>
</html>
